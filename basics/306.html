<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Круг</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .circle {
            position: absolute;
            left: 100px;
            top: 100px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
            cursor: pointer;
            transition: all 0.5s ease-in-out;
        }

        .circle.enlarged {
            animation: enlargeAndChangeColor 0.5s ease-in-out forwards;
        }

        .circle.normal {
            animation: returnToNormal 0.5s ease-in-out forwards;
        }

        .circle.outline {
            animation: toOutline 0.5s ease-in-out forwards;
        }

        @keyframes enlargeAndChangeColor {
            0% {
                transform: scale(1);
                background: linear-gradient(45deg, #ff6b6b, #ffa726);
            }
            100% {
                transform: scale(2);
                background: linear-gradient(45deg, #4ecdc4, #44a08d);
            }
        }

        @keyframes returnToNormal {
            0% {
                transform: scale(2);
                background: linear-gradient(45deg, #4ecdc4, #44a08d);
            }
            100% {
                transform: scale(1);
                background: linear-gradient(45deg, #ff6b6b, #ffa726);
            }
        }

        @keyframes toOutline {
            0% {
                transform: scale(1);
                background: linear-gradient(45deg, #ff6b6b, #ffa726);
            }
            100% {
                transform: scale(1);
                background: transparent;
                border: 3px solid #ff6b6b;
            }
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            text-align: center;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="circle" id="circle"></div>
    
    <div class="instructions">
        Кликайте по кругу
    </div>

    <script>
        let clickCount = 0;
        const circle = document.getElementById('circle');

        circle.addEventListener('click', function() {
            clickCount++;
            
            circle.classList.remove('enlarged', 'normal', 'outline');
            
            switch(clickCount) {
                case 1:
                    // Первый клик - увеличение и изменение цвета
                    circle.classList.add('enlarged');
                    break;
                case 2:
                    // Второй клик - исходное состояние
                    circle.classList.add('normal');
                    break;
                case 3:
                    // Третий клик - контур
                    circle.classList.add('outline');
                    break;
                case 4:
                    // Четвертый клик - удаление элемента
                    circle.remove();
                    break;
            }
        });
    </script>
</body>
</html>
