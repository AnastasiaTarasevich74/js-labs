<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px;
        }
        
        .timer-container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .timer-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-family: 'Courier New', monospace;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            transition: color 0.3s;
        }
        
        .timer-display.warning {
            color: #e74c3c;
        }
        
        .input-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .input-container label {
            font-size: 1rem;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input[type="number"] {
            width: 120px;
            padding: 12px 15px;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            border-color: #3498db;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        #startBtn {
            background-color: #2ecc71;
            color: white;
        }
        
        #startBtn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        
        #stopBtn {
            background-color: #e74c3c;
            color: white;
            display: none;
        }
        
        #stopBtn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
        
        #resetBtn {
            background-color: #3498db;
            color: white;
            display: none;
        }
        
        #resetBtn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        
        @media (max-width: 600px) {
            .timer-container {
                padding: 30px 20px;
            }
            
            .timer-display {
                font-size: 3.5rem;
            }
            
            button {
                padding: 12px 20px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <h1>Таймер обратного отсчета</h1>
        
        <div class="timer-display" id="timerDisplay">
            00:00:00
        </div>
        
        <div class="input-group">
            <div class="input-container">
                <label for="minutesInput">Минуты</label>
                <input type="number" id="minutesInput" min="0" max="59" value="1">
            </div>
            
            <div class="input-container">
                <label for="secondsInput">Секунды</label>
                <input type="number" id="secondsInput" min="0" max="59" value="0">
            </div>
        </div>
        
        <div class="buttons">
            <button id="startBtn">Старт</button>
            <button id="stopBtn">Стоп</button>
            <button id="resetBtn">Сброс</button>
        </div>
        
    </div>

    <script>
        // Получаем элементы DOM
        const timerDisplay = document.getElementById('timerDisplay');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // Переменные для управления таймером
        let timerInterval = null;
        let totalMilliseconds = 0;
        let initialTime = 0;
        let isRunning = false;
        
        // Функция для обновления отображения таймера
        function updateTimerDisplay() {
            const timeLeft = Math.max(0, totalMilliseconds);
            const minutes = Math.floor(timeLeft / 60000);
            const seconds = Math.floor((timeLeft % 60000) / 1000);
            const milliseconds = Math.floor((timeLeft % 1000) / 10);
            
            // Форматирование с ведущими нулями
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');
            const formattedMilliseconds = milliseconds.toString().padStart(2, '0');
            
            timerDisplay.textContent = `${formattedMinutes}:${formattedSeconds}:${formattedMilliseconds}`;
            
            // Меняем цвет при малом остатке времени (менее 10 секунд)
            if (timeLeft <= 10000 && timeLeft > 0) {
                timerDisplay.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
            }
        }
        
        // Функция для запуска таймера обратного отсчета
        function startTimer() {
            if (isRunning) return;
            
            // Если таймер на нуле, берем значения из полей ввода
            if (totalMilliseconds === 0) {
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                totalMilliseconds = (minutes * 60 + seconds) * 1000;
                initialTime = totalMilliseconds;
                
                // Если время не установлено, устанавливаем 1 минуту по умолчанию
                if (totalMilliseconds === 0) {
                    totalMilliseconds = 60000; // 1 минута
                    initialTime = totalMilliseconds;
                }
            }
            
            // Проверяем, не истекло ли уже время
            if (totalMilliseconds <= 0) {
                alert("Время уже истекло! Установите новое время.");
                return;
            }
            
            // Запускаем таймер
            isRunning = true;
            startBtn.disabled = true;
            minutesInput.disabled = true;
            secondsInput.disabled = true;
            
            // Показываем кнопки "Стоп" и "Сброс"
            stopBtn.style.display = 'inline-block';
            resetBtn.style.display = 'inline-block';
            
            // Сохраняем время начала отсчета
            const startTime = Date.now();
            const initialTotalMs = totalMilliseconds;
            
            // Обновляем таймер каждые 10 мс для отображения долей секунды
            timerInterval = setInterval(() => {
                const elapsedTime = Date.now() - startTime;
                totalMilliseconds = Math.max(0, initialTotalMs - elapsedTime);
                
                // Останавливаем таймер, когда время истекло
                if (totalMilliseconds <= 0) {
                    stopTimer();
                    timerDisplay.textContent = "00:00:00";
                    timerDisplay.classList.add('warning');
                    
                    // Воспроизводим звук окончания времени (если браузер позволяет)
                    try {
                        // Создаем звуковой сигнал
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        
                        oscillator.frequency.value = 800;
                        oscillator.type = 'sine';
                        
                        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
                        
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + 1);
                    } catch (e) {
                        // Если AudioContext не поддерживается, просто показываем алерт
                        console.log("AudioContext не поддерживается в этом браузере");
                    }
                    
                    alert("Время вышло!");
                    return;
                }
                
                updateTimerDisplay();
            }, 10);
        }
        
        // Функция для остановки таймера
        function stopTimer() {
            if (!isRunning) return;
            
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.disabled = false;
            
            // Обновляем поля ввода с текущим оставшимся временем
            const minutes = Math.floor(totalMilliseconds / 60000);
            const seconds = Math.floor((totalMilliseconds % 60000) / 1000);
            
            minutesInput.value = minutes;
            secondsInput.value = seconds;
        }
        
        // Функция для сброса таймера
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            totalMilliseconds = 0;
            initialTime = 0;
            
            // Сбрасываем отображение
            updateTimerDisplay();
            timerDisplay.classList.remove('warning');
            
            // Включаем поля ввода и кнопку старт
            startBtn.disabled = false;
            minutesInput.disabled = false;
            secondsInput.disabled = false;
            
            // Скрываем кнопки "Стоп" и "Сброс"
            stopBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            
            // Сбрасываем поля ввода к начальным значениям
            minutesInput.value = 1;
            secondsInput.value = 0;
        }
        
        // Обработчики событий для кнопок
        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        // Обработчики для полей ввода
        minutesInput.addEventListener('change', function() {
            let value = parseInt(this.value);
            if (isNaN(value) || value < 0) value = 0;
            if (value > 59) value = 59;
            this.value = value;
            
            // Сбрасываем таймер при изменении времени
            if (!isRunning) {
                totalMilliseconds = 0;
                updateTimerDisplay();
            }
        });
        
        secondsInput.addEventListener('change', function() {
            let value = parseInt(this.value);
            if (isNaN(value) || value < 0) value = 0;
            if (value > 59) value = 59;
            this.value = value;
            
            // Сбрасываем таймер при изменении времени
            if (!isRunning) {
                totalMilliseconds = 0;
                updateTimerDisplay();
            }
        });
        
        // Инициализация отображения таймера
        updateTimerDisplay();
    </script>
</body>
</html>
