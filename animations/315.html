<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рождественская гирлянда</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #001122, #003344);
            min-height: 100vh;
            overflow: hidden;
        }
        
        .garland {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            height: 100px;
        }
        
        .wire {
            position: absolute;
            top: 30px;
            left: -10px;
            width: calc(100% + 20px);
            height: 2px;
            background: linear-gradient(90deg, 
                #666 0%, 
                #888 25%, 
                #aaa 50%, 
                #888 75%, 
                #666 100%);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .bulb {
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            filter: drop-shadow(0 0 8px currentColor);
            transition: transform 0.2s;
        }
        
        .bulb::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 8px;
            background: #aaa;
            border-radius: 2px 2px 0 0;
        }
        
        .red { 
            background: radial-gradient(circle at 30% 30%, #ff5555, #cc0000);
            box-shadow: 0 0 15px #ff0000;
        }
        
        .green { 
            background: radial-gradient(circle at 30% 30%, #55ff55, #00aa00);
            box-shadow: 0 0 15px #00ff00;
        }
        
        .blue { 
            background: radial-gradient(circle at 30% 30%, #5555ff, #0000cc);
            box-shadow: 0 0 15px #0000ff;
        }
        
        .yellow { 
            background: radial-gradient(circle at 30% 30%, #ffff55, #ccaa00);
            box-shadow: 0 0 15px #ffff00;
        }
        
        .snowflake {
            position: absolute;
            color: white;
            font-size: 20px;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
    </style>
</head>
<body>
    <div class="garland" id="garland"></div>
    <div class="wire"></div>
    
    <script>
        // Создаем гирлянду
        const garland = document.getElementById('garland');
        const colors = ['red', 'green', 'blue', 'yellow'];
        
        // Создаем 32 лампочки
        for (let i = 0; i < 32; i++) {
            const bulb = document.createElement('div');
            const colorClass = colors[i % 4];
            bulb.className = `bulb ${colorClass}`;
            
            // Расчет позиции: волнообразное расположение
            const x = (i / 31) * 95; // От 0% до 95% ширины
            const y = Math.sin(i * 0.5) * 20 + 30; // Волна
            
            bulb.style.left = `${x}%`;
            bulb.style.top = `${y}px`;
            
            garland.appendChild(bulb);
        }
        
        // Мигание с разной интенсивностью для разных цветов
        function blink() {
            const bulbs = document.querySelectorAll('.bulb');
            bulbs.forEach((bulb, index) => {
                // Разная частота мигания для разных цветов
                const colorIndex = index % 4;
                let intensity;
                
                if (Math.random() > 0.7) {
                    // Сильное свечение
                    intensity = 1;
                    bulb.style.transform = 'scale(1.2)';
                } else if (Math.random() > 0.4) {
                    // Среднее свечение
                    intensity = 0.7;
                    bulb.style.transform = 'scale(1)';
                } else {
                    // Слабое свечение
                    intensity = 0.4;
                    bulb.style.transform = 'scale(0.9)';
                }
                
                // Разное поведение для разных цветов
                switch(colorIndex) {
                    case 0: // red - чаще мигает
                        bulb.style.opacity = Math.random() > 0.3 ? intensity : 0.2;
                        break;
                    case 1: // green - плавнее
                        bulb.style.opacity = 0.5 + Math.sin(Date.now()/500 + index) * 0.5;
                        break;
                    case 2: // blue - реже мигает
                        bulb.style.opacity = Math.random() > 0.6 ? intensity : 0.3;
                        break;
                    case 3: // yellow - хаотично
                        bulb.style.opacity = Math.random() > 0.5 ? intensity : 0.4;
                        break;
                }
            });
        }
        
        // Создаем снежинки для фона
        function createSnowflakes() {
            const snowflakes = ['❄', '❅', '❆', '*'];
            for (let i = 0; i < 20; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                snowflake.style.left = `${Math.random() * 100}%`;
                snowflake.style.top = `${Math.random() * -20}%`; // Начинаем выше экрана
                snowflake.style.animationDuration = `${10 + Math.random() * 20}s`; // Медленнее падение
                snowflake.style.animationDelay = `${Math.random() * 5}s`;
                document.body.appendChild(snowflake);
            }
        }
        
        // Запускаем мигание
        setInterval(blink, 200);
        
        // Добавляем снежинки
        createSnowflakes();
        
        // Добавляем случайные подмигивания
        setInterval(() => {
            const bulbs = document.querySelectorAll('.bulb');
            const randomBulb = bulbs[Math.floor(Math.random() * bulbs.length)];
            randomBulb.style.transform = 'scale(1.3)';
            randomBulb.style.opacity = '1';
            
            setTimeout(() => {
                randomBulb.style.transform = 'scale(1)';
            }, 100);
        }, 800);
    </script>
</body>
</html>
